name: Publish Mod to Modrinth & CurseForge

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  prepare:
    name: Parse Mod JARs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}

    steps:
      - name: Download JARs from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p jars
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.jar" \
            --dir ./jars

      - name: Parse filenames and build publish matrix
        id: parse
        shell: python3 {0}
        run: |
          import json
          import os
          import re
          import sys
          from pathlib import Path

          # Matches: <mod_id>+<mc_version>-<mod_version>-<loader>.jar
          # Example: better_creeper_consent+26.2-1.5.1-fabric.jar
          # Automatically ignores -sources.jar, -dev.jar, -javadoc.jar, etc.
          pattern = re.compile(
              r"^[^+]+\+(\d+(?:\.\d+)+(?:-(?:pre|rc|snapshot)-?\d+)?)-(.+?)-(fabric|neoforge)\.jar$",
              re.IGNORECASE,
          )

          entries = []
          for jar_path in sorted(Path("jars").rglob("*.jar")):
              match = pattern.match(jar_path.name)
              if not match:
                  print(f"Skipping unmatched file: {jar_path.name}")
                  continue

              mc_version, mod_version, loader = match.groups()
              loader = loader.lower()

              # Detect release channel from mod version
              lower_ver = mod_version.lower()
              if "alpha" in lower_ver:
                  version_type = "alpha"
              elif "beta" in lower_ver or "rc" in lower_ver:
                  version_type = "beta"
              else:
                  version_type = "release"

              release_name = f"{mc_version}-{mod_version}-{loader}"

              entry = {
                  "file": jar_path.as_posix(),
                  "mc_version": mc_version,
                  "mod_version": mod_version,
                  "loader": loader,
                  "version_type": version_type,
                  "release_name": release_name,
              }
              entries.append(entry)
              print(f"Queued: {jar_path.name} -> {release_name} ({version_type})")

          if not entries:
              print("::error::No matching Fabric or NeoForge JAR files found!")
              sys.exit(1)

          matrix_json = json.dumps({"include": entries})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"matrix={matrix_json}\n")

      - name: Upload JARs for publish jobs
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: ./jars
          retention-days: 1

  publish:
    name: Publish ${{ matrix.release_name }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          name: mod-jars
          path: ./jars

      - name: Publish to Modrinth and CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: "YOUR_MODRINTH_PROJECT_ID"
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: "YOUR_CURSEFORGE_PROJECT_ID"
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: ${{ matrix.file }}
          name: ${{ matrix.release_name }}
          version: ${{ matrix.release_name }}
          version-type: ${{ matrix.version_type }}
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.mc_version }}
          game-version-filter: none
          changelog: ${{ github.event.release.body || format('Release {0}', matrix.mod_version) }}
          dependencies: ${{ matrix.loader == 'fabric' && 'fabric-api(required)\nfabric-language-kotlin(required)' || 'kotlin-for-forge(required)#(ignore:curseforge)' }}