name: Publish GH release on Modrinth & CurseForge

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download jars from the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.jar" --dir assets
          ls -l assets

      - name: Publish Fabric version
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            assets/*-fabric.jar

          name: ${{ github.event.release.name }} (Fabric)
          version: ${{ github.event.release.tag_name }}+fabric
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}

          loaders: fabric
          game-versions: ${{ vars.MINECRAFT_VERSION }}

          dependencies: |
            fabric-api(required)
            fabric-language-kotlin(required)

          fail-mode: fail

      - name: Publish NeoForge version
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            assets/*-neoforge.jar

          name: ${{ github.event.release.name }} (NeoForge)
          version: ${{ github.event.release.tag_name }}+neoforge
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}

          loaders: neoforge
          game-versions: ${{ vars.MINECRAFT_VERSION }}

          dependencies: |
            kotlin-lang-forge(required)#(ignore:curseforge)

          fail-mode: fail