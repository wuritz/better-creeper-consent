name: Publish GH release on Modrinth & CurseForge

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix from release assets
        id: matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          matrix=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '
            [ .assets[].name
              | capture("\\+(?<mc>[^-]+)-(?<loader>fabric|neoforge)\\.jar$") + {file: .}
            ]' | jq -c .)

          echo "Matrix: $matrix"

          if [ "$(jq length <<< "$matrix")" -eq 0 ]; then
            echo "No *-fabric.jar / *-neoforge.jar assets found on release $TAG" >&2
            exit 1
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.loader }} ${{ matrix.mc }}
    steps:
      - name: Download jar from the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          FILE: ${{ matrix.file }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$FILE" --dir assets
          ls -l assets

      - name: Publish Fabric version
        if: matrix.loader == 'fabric'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: assets/${{ matrix.file }}

          name: ${{ github.event.release.name }} (Fabric ${{ matrix.mc }})
          version: ${{ github.event.release.tag_name }}+${{ matrix.mc }}-fabric
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}

          loaders: fabric
          game-versions: ${{ matrix.mc }}

          dependencies: |
            fabric-api(required)
            fabric-language-kotlin(required)

          fail-mode: fail

      - name: Publish NeoForge version
        if: matrix.loader == 'neoforge'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: assets/${{ matrix.file }}

          name: ${{ github.event.release.name }} (NeoForge ${{ matrix.mc }})
          version: ${{ github.event.release.tag_name }}+${{ matrix.mc }}-neoforge
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}

          loaders: neoforge
          game-versions: ${{ matrix.mc }}

          dependencies: |
            kotlin-for-forge(required)#(ignore:curseforge)

          fail-mode: fail